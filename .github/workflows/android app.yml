name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # FIX 1: Node 22 (required by Capacitor)
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # FIX 2: Install JS dependencies CLEANLY
      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      # FIX 3: Build web app (Vite)
      - name: Build web app
        run: npm run build

      # FIX 4: Setup Java 17 (Android stable)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # FIX 5: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # FIX 6: Sync Capacitor -> Android folder
      - name: Sync Capacitor Android
        run: npx cap sync android

      # FIX 7: Fix Gradle wrapper permissions
      - name: Fix gradlew permissions
        run: chmod +x android/gradlew

      # FIX 8: Build APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # FIX 9: Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mcq-prep-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
